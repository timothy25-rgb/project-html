<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Qwigley&family=Sixtyfour+Convergence&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-wrapper" id="top">
    <div class="header-box">
      <h1 class="css-project-title">CSS Project</h1>
    </div>

    <form id="infoForm" action="#" method="post">
      <div class="info-bar">
        <label for="name">Name :</label>
        <input type="text" id="name" name="name">

        <label for="major">Major :</label>
        <input type="text" id="major" name="major">

        <button type="submit" class="btn-info">Submit your information</button>
      </div>
    </form>

    <div class="survey-banner">
      <div class="survey-heading">
        <span class="cap-letter">S</span>urvey <span class="cap-letter">F</span>orm
      </div>
      <p class="qwigley-note">
        Please fill this form as best as you can! Following all the CSS rules. Thank you so much. GBU as always.
      </p>
    </div>

    <form id="surveyForm" action="#" method="post">
      <fieldset class="details-fieldset">
        <legend>Your Details:</legend>

        <div class="row-item">
          <label class="row-label" for="email">Email :</label>
          <input type="email" id="email" name="email">
        </div>

        <div class="row-item">
          <span class="row-label">Gender :</span>
          <label class="inline-choice">
            <input type="radio" name="gender" value="female"> Female
          </label>
          <label class="inline-choice">
            <input type="radio" name="gender" value="male"> Male
          </label>
        </div>

        <div class="row-item">
          <label class="row-label" for="grade">Grade :</label>
          <select id="grade" name="grade">
            <option value="freshman" selected>Freshman</option>
            <option value="sophomore">Sophomore</option>
            <option value="junior">Junior</option>
            <option value="senior">Senior</option>
          </select>
        </div>
      </fieldset>

      <fieldset class="questions-fieldset">
        <legend>Questions :</legend>

        <div class="q-inline">
          <label class="q-title" for="semester">How is your semester going?</label>
          <select id="semester" name="semester">
            <option value="best" selected>Best</option>
            <option value="good">Good</option>
            <option value="okay">Okay</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="q-block">
          <span class="q-title">What class are you struggling with?</span>
          <div class="choice-group">
            <label><input type="checkbox" name="struggling" value="web"> Web</label>
            <label><input type="checkbox" name="struggling" value="python"> Python</label>
            <label><input type="checkbox" name="struggling" value="english"> English</label>
            <label><input type="checkbox" name="struggling" value="math"> Math</label>
          </div>
        </div>

        <div class="q-block">
          <span class="q-title">What day do you like the most?</span>
          <div class="choice-group">
            <label><input type="radio" name="liked_day" value="monday"> Monday</label>
            <label class="red-day"><input type="radio" name="liked_day" value="tuesday"> Tuesday</label>
            <label class="red-day"><input type="radio" name="liked_day" value="wednesday"> Wednesday</label>
            <label><input type="radio" name="liked_day" value="thursday"> Thursday</label>
            <label><input type="radio" name="liked_day" value="friday"> Friday</label>
          </div>
        </div>

        <div class="q-block">
          <label class="q-title" for="comments">Comments</label>
          <textarea id="comments" name="comments"></textarea>
        </div>
      </fieldset>

      <div class="go-top-bar">
        <a href="#top" id="goTopLink">Go to the Top</a>
      </div>

      <div class="submit-area">
        <button type="submit" class="btn-submit">Submit review</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
